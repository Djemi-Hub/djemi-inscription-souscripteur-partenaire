<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>LADiASS — Gestion d'assurance santé</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="LADiASS - Plateforme numérique de gestion d'assurance santé multi-acteurs">
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <app-root>
    <!-- Startup Splash Screen -->
    <div style="position:fixed;inset:0;background-color:#ffffff;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:99999;font-family:'Inter',sans-serif;">
      <div style="position:relative;display:flex;flex-direction:column;align-items:center;gap:1.5rem;">
        <div style="width:5rem;height:5rem;border-radius:1rem;overflow:hidden;box-shadow:0 10px 25px -5px rgba(5,150,105,0.25);animation:splashPulse 1.8s ease-in-out infinite;">
          <img src="logo.png" alt="LADiASS" style="width:100%;height:100%;object-fit:cover;" />
        </div>
        <div style="text-align:center;">
          <h1 style="font-size:1.5rem;font-weight:700;color:#059669;margin:0;letter-spacing:-0.025em;">LADi<span style="color:#1f2937;">ASS</span></h1>
          <p style="font-size:0.875rem;color:#6b7280;margin-top:0.25rem;">Plateforme de gestion d'assurance santé</p>
        </div>
        <div style="width:10rem;height:4px;background-color:#e5e7eb;border-radius:9999px;overflow:hidden;margin-top:0.5rem;">
          <div style="width:50%;height:100%;background-color:#059669;border-radius:9999px;animation:splashBar 1.5s ease-in-out infinite;"></div>
        </div>
      </div>
    </div>
    <style>
      @keyframes splashPulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.06);} }
      @keyframes splashBar { 0%{transform:translateX(-100%);} 100%{transform:translateX(200%);} }
    </style>
  </app-root>
</body>
</html>
